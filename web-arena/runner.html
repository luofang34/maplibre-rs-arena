<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapLibre Arena Engine Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #maplibre {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #gl-container {
        position: absolute;
        inset: 0;
        display: none;
      }
      #runner-banner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(circle at 50% 35%, rgba(15, 23, 42, 0.88), rgba(9, 13, 22, 0.96));
        z-index: 20;
        text-align: center;
      }
      #runner-banner[hidden] {
        display: none;
      }
      .banner-card {
        max-width: 28rem;
        padding: 1.25rem 1.5rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }
      .banner-card h2 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #f8fafc;
      }
      .banner-card p {
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.55;
        color: #94a3b8;
      }
      .banner-card code {
        display: inline-block;
        margin-top: 0.55rem;
        padding: 0.2rem 0.45rem;
        border-radius: 0.35rem;
        background: rgba(30, 41, 59, 0.9);
        color: #38bdf8;
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="maplibre"></canvas>
      <div id="gl-container"></div>
      <div id="runner-banner" hidden>
        <div class="banner-card">
          <h2 id="banner-title">正在初始化渲染内核…</h2>
          <p id="banner-desc"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/runner/entry.ts"></script>
  </body>
</html>
